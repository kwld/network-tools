services:
  scanner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: network-scanner
    env_file:
      - .env
    volumes:
      - ./config:/config:ro
      - ./output:/output
    networks:
      - network-tools
    restart: "no"  # Run once and exit

networks:
  network-tools:
    driver: bridge
